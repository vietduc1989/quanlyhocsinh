# This Nginx configuration is tailored for running within a Docker container
# and serving a React application. It uses a non-root user for enhanced security.

user appuser; # Specifies the non-root user Nginx workers will run as
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on; # Optimizes sending of data by minimizing TCP packets

    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any; # Enable gzip for all proxied requests
    gzip_comp_level 6; # Compression level (1-9)
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types application/atom+xml application/geo+json application/json application/ld+json application/manifest+json application/rdf+xml application/rss+xml application/vnd.ms-fontobject application/x-web-app-manifest+json application/xhtml+xml application/xml font/eot font/otf font/ttf image/svg+xml text/css text/javascript text/plain text/xml;

    server {
        listen 80;
        server_name localhost; # Can be replaced with your domain in production

        location / {
            root /usr/share/nginx/html; # Directory where React build output is placed
            try_files $uri $uri/ /index.html; # Essential for React Router to handle refreshes
        }

