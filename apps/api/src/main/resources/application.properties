# QUAN-20260530-0942

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/quanlyhocsinh_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none # Using Flyway for schema management
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Flyway Migration (or Liquibase)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Server Configuration ---
server.port=8080
server.servlet.context-path=/api

# --- Feign Client Configuration for LopHoc Module ---
# Base URL for the external LopHoc service
lopHoc.service.url=http://localhost:8081/api/lop-hoc # Assuming LopHoc module runs on 8081
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# --- Spring Security (Placeholder for ONENET AuthN/AuthZ) ---
# For demonstration, we'll use basic authentication or JWT integration
# In a real ONENET scenario, this would integrate with a central AuthN/AuthZ service
# Example: Disable CSRF for stateless REST APIs (ensure proper token-based security)
spring.security.csrf.disable=true
# Example: JWT configuration properties would go here

# --- Auditing Configuration ---
spring.data.jpa.entity.listeners.auditing.enabled=true

# --- CORS Configuration ---
app.cors.allowed-origins=http://localhost:3000 # Frontend URL

# --- Logging ---
logging.level.com.onenet.quanlyhocsinh=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE