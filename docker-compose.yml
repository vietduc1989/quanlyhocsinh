version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Expose for local development/tools, consider removing in production if not needed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s # Give the DB time to start before checking

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080
    environment:
      ASPNETCORE_URLS: http://+:8080 # Ensure ASP.NET listens on 8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      # Add other environment variables as needed for your API
    depends_on:
      db:
        condition: service_healthy # Ensure DB is healthy before starting API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"] # Assuming a /health endpoint exists
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s # Give the API time to start before checking

volumes:
  db_data: